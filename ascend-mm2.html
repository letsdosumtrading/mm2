<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascend MM2 — Cheapest items out of anywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#faf6ec;
    --cloud:#ffffff;
    --cloud2:#fbf8f0;
    --gold:#c9a24a;
    --gold-deep:#8c6d1f;
    --gold-soft:#e8d9ad;
    --sky:#7fb2d9;
    --sky-deep:#4f85ad;
    --ink:#2e2a1f;
    --ink-dim:#8a8267;
    --halo:#fff6d9;
    --border:#ecdfb8;
    --border-lt:#ddc98a;
    --danger:#b3432f;
    --success:#4f8f5f;
  }
  [data-theme="dark"]{
    --ivory:#161320;
    --cloud:#1f1b2e;
    --cloud2:#241f35;
    --gold:#d9b45f;
    --gold-deep:#f0cc7a;
    --gold-soft:#4a3d1f;
    --sky:#7fb2d9;
    --sky-deep:#9dd0f2;
    --ink:#f1ecdf;
    --ink-dim:#a89fc4;
    --halo:#2c2340;
    --border:#3a3252;
    --border-lt:#4d4368;
    --danger:#e2685a;
    --success:#6fcf8a;
  }
  [data-theme="dark"] .splash{
    background:radial-gradient(ellipse 1200px 700px at 50% 40%, #241f38, var(--ivory) 65%);
  }
  [data-theme="dark"] .splash-cloud{
    background:radial-gradient(ellipse at center, rgba(217,180,95,0.25) 0%, rgba(255,255,255,0) 70%);
  }
  [data-theme="dark"] .item-media{
    background:linear-gradient(160deg, var(--halo), var(--cloud2));
  }
  .theme-toggle{
    background:var(--cloud2);border:1px solid var(--border-lt);color:var(--ink);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-toggle:hover{border-color:var(--gold);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    /* flat fallback only — the moving wash + orbs live in .site-bg so they
       aren't painted over by this element's own background */
    background:var(--ivory);
  }
  h1,h2,h3,.display{
    font-family:'Cinzel', serif;
    letter-spacing:0.02em;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .app{max-width:1120px;margin:0 auto;padding:0 20px 70px;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid var(--border);
    flex-wrap:wrap;gap:12px;
    background:linear-gradient(180deg, rgba(255,246,217,0.6), transparent);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold) 70%);
    box-shadow:0 0 14px rgba(201,162,74,0.55);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel';font-weight:700;color:#5c4413;font-size:15px;
  }
  .brand .title{font-weight:600;font-size:20px;letter-spacing:0.03em;color:var(--gold-deep);}
  .brand .subtitle{font-size:10px;color:var(--ink-dim);letter-spacing:0.18em;margin-top:-2px;text-transform:uppercase;}
  .nav{display:flex;gap:2px;flex-wrap:wrap;}
  .nav button{
    background:transparent;border:1px solid transparent;color:var(--ink-dim);
    font-family:'Cinzel';text-transform:uppercase;letter-spacing:0.04em;font-size:12px;
    padding:8px 12px;cursor:pointer;border-radius:6px;
  }
  .nav button:hover{color:var(--ink);background:rgba(201,162,74,0.08);}
  .nav button.active{color:var(--gold-deep);background:rgba(201,162,74,0.14);}
  .nav .badge{background:var(--gold);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-dim);}
  .user-chip b{color:var(--ink);}
  .owner-tag{color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold-deep));padding:1px 8px;border-radius:8px;font-size:10px;letter-spacing:0.06em;margin-left:4px;}
  .admin-tag{color:var(--sky-deep);border:1px solid var(--sky);padding:1px 8px;border-radius:8px;font-size:10px;letter-spacing:0.06em;margin-left:4px;}
  .user-chip button{
    background:none;border:1px solid var(--border-lt);color:var(--ink-dim);
    font-family:'Inter';font-size:11.5px;padding:5px 10px;cursor:pointer;border-radius:6px;
  }
  .user-chip button:hover{border-color:var(--gold);color:var(--ink);}

  /* ---------- Generic ---------- */
  .section-title{font-size:24px;margin:26px 0 4px;color:var(--gold-deep);}
  .section-sub{color:var(--ink-dim);font-size:13px;margin-bottom:20px;}
  .btn{
    font-family:'Cinzel';text-transform:uppercase;letter-spacing:0.04em;
    background:linear-gradient(135deg, var(--gold), var(--gold-deep));color:#fff;border:none;padding:10px 20px;
    cursor:pointer;border-radius:8px;font-size:12.5px;font-weight:600;
    box-shadow:0 2px 8px rgba(140,109,31,0.25);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:transparent;border:1px solid var(--border-lt);color:var(--ink);box-shadow:none;}
  .btn.secondary:hover{border-color:var(--gold);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--ink-dim);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--cloud);border:1px solid var(--border-lt);color:var(--ink);
    padding:10px 12px;font-family:'Inter';font-size:13.5px;border-radius:8px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--gold);}
  .error-note{
    color:var(--danger);font-size:12px;margin-top:8px;padding:9px 12px;border-radius:8px;
    border-left:3px solid var(--danger);background:rgba(179,67,47,0.07);
  }
  .info-note{
    color:var(--gold-deep);font-size:12px;margin-top:8px;padding:9px 12px;border-radius:8px;
    border-left:3px solid var(--gold);background:rgba(201,162,74,0.08);
  }
  .loading{color:var(--ink-dim);font-size:13px;padding:40px 0;text-align:center;}
  .card{background:var(--cloud);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 14px rgba(140,109,31,0.06);}

  /* ---------- Splash ---------- */
  .splash{
    position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:radial-gradient(ellipse 1200px 700px at 50% 40%, #fffdf3, var(--ivory) 65%);
    overflow:hidden;cursor:pointer;
  }
  .splash-rays{
    position:absolute;inset:-20%;
    /* period (18deg) divides evenly into 360 so the loop point is seamless — no visible seam/jump */
    background:repeating-conic-gradient(from 0deg, rgba(255,230,150,0.35) 0deg 4deg, transparent 4deg 18deg);
    animation:rayspin 40s linear infinite;
    opacity:0.6;
  }
  @keyframes rayspin{ to{ transform:rotate(360deg); } }
  .splash-cloud{
    position:absolute;bottom:-10%;width:60%;opacity:0.9;filter:blur(1px);
    background:radial-gradient(ellipse at center, #ffffff 0%, rgba(255,255,255,0) 70%);
    height:300px;border-radius:50%;
  }
  .splash-cloud.left{left:-15%;animation:driftleft 18s ease-in-out infinite;}
  .splash-cloud.right{right:-15%;animation:driftright 22s ease-in-out infinite;}
  @keyframes driftleft{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(40px);} }
  @keyframes driftright{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(-40px);} }
  .splash-content{position:relative;z-index:2;text-align:center;}
  .splash-title{
    font-family:'Cinzel';font-weight:700;font-size:56px;letter-spacing:0.08em;
    color:var(--gold-deep);
    opacity:0;transform:translateY(24px) scale(0.96);
    animation:riseIn 1.3s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    text-shadow:0 0 30px rgba(201,162,74,0.35);
  }
  .splash-sub{
    font-family:'Inter';font-size:14px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink-dim);margin-top:10px;
    opacity:0;animation:fadeIn 1.2s ease 1s forwards;
  }
  .splash-hint{
    font-family:'Inter';font-size:11px;color:var(--ink-dim);margin-top:34px;opacity:0;
    animation:fadeIn 1s ease 2s forwards;
  }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---------- Auth ---------- */
  .auth-wrap{display:flex;justify-content:center;padding:60px 20px;}
  .auth-card{width:100%;max-width:380px;background:var(--cloud);border:1px solid var(--border);border-radius:16px;padding:30px;position:relative;box-shadow:0 8px 30px rgba(140,109,31,0.1);}
  .auth-card::before{
    content:'✦ ASCEND MM2 ✦';position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ivory);
    padding:0 10px;font-family:'Cinzel';font-size:10px;letter-spacing:0.15em;color:var(--gold-deep);white-space:nowrap;
  }
  .auth-tabs{display:flex;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .auth-tabs button{
    flex:1;background:none;border:none;color:var(--ink-dim);padding:10px 0;
    font-family:'Cinzel';text-transform:uppercase;letter-spacing:0.05em;font-size:13px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .auth-tabs button.active{color:var(--gold-deep);border-color:var(--gold);}

  /* ---------- Catalog ---------- */
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:18px;}
  .item-card{background:var(--cloud);border:1px solid var(--border);border-radius:14px;position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 12px rgba(140,109,31,0.06);transition:transform 0.15s;}
  .item-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(140,109,31,0.14);}
  .item-media{
    height:112px;display:flex;align-items:center;justify-content:center;font-size:48px;
    background:linear-gradient(160deg, var(--halo), var(--cloud2));
    border-bottom:1px solid var(--border);position:relative;
  }
  .item-media img{width:100%;height:100%;object-fit:cover;}
  .stock-tape{position:absolute;top:8px;right:8px;background:var(--gold);color:#fff;font-family:'Cinzel';font-size:9.5px;letter-spacing:0.05em;padding:3px 8px;border-radius:6px;font-weight:600;}
  .stock-tape.low{background:var(--danger);}
  .stock-tape.none{background:#b0a98f;}
  .item-body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .item-name{font-family:'Cinzel';font-size:14.5px;line-height:1.25;color:var(--ink);}
  .item-social{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--sky-deep);min-height:14px;}
  .item-social .cart-flag{color:var(--gold-deep);}
  .item-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
  .item-price{font-family:'JetBrains Mono';color:var(--gold-deep);font-size:15px;font-weight:600;}
  .qty-row{display:flex;align-items:center;gap:8px;}
  .qty-row button{width:26px;height:26px;background:var(--cloud2);border:1px solid var(--border-lt);color:var(--ink);cursor:pointer;font-size:14px;border-radius:6px;}
  .qty-row span{min-width:20px;text-align:center;font-size:13px;}
  .add-btn{width:100%;margin-top:2px;}

  /* ---------- Cart ---------- */
  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--cloud);border-top:2px solid var(--gold);padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:20px;z-index:50;box-shadow:0 -4px 18px rgba(140,109,31,0.1);}
  .cart-bar .info{font-size:13px;color:var(--ink-dim);}
  .cart-bar .info b{color:var(--ink);}
  .modal-overlay{position:fixed;inset:0;background:rgba(46,42,31,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--cloud);border:1px solid var(--border);border-radius:16px;max-width:460px;width:100%;padding:26px;max-height:85vh;overflow-y:auto;}
  .modal h3{margin-top:0;color:var(--gold-deep);}
  .cart-line{display:flex;justify-content:space-between;font-size:13px;padding:9px 0;border-bottom:1px solid var(--border);}
  .cart-line button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:11px;}
  .cart-total{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:17px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-lt);color:var(--gold-deep);}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .order-code-box{
    text-align:center;padding:20px;border:2px dashed var(--gold);border-radius:12px;background:var(--halo);margin:16px 0;
  }
  .order-code-box .code{font-family:'JetBrains Mono';font-size:24px;font-weight:600;letter-spacing:0.08em;color:var(--gold-deep);margin:6px 0;}

  /* ---------- Orders / status pill ---------- */
  .order-card{background:var(--cloud);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .order-left .case-no{font-family:'Cinzel';font-size:19px;color:var(--gold-deep);}
  .order-left .meta{color:var(--ink-dim);font-size:11.5px;margin-top:2px;}
  .order-items{margin-top:10px;font-size:12.5px;color:var(--ink-dim);}
  .order-items div{padding:2px 0;}
  .order-total{font-family:'Cinzel';color:var(--gold-deep);margin-top:8px;font-size:14px;}
  .order-code-tag{font-family:'JetBrains Mono';font-size:11px;color:var(--sky-deep);margin-top:6px;}
  .status-pill{font-family:'Cinzel';font-weight:600;letter-spacing:0.06em;font-size:12px;padding:8px 16px;border-radius:20px;white-space:nowrap;}
  .status-pill.PENDING{color:var(--gold-deep);background:var(--halo);border:1px solid var(--gold-soft);}
  .status-pill.PROCESSING{color:var(--sky-deep);background:#eaf4fb;border:1px solid var(--sky);}
  .status-pill.FULFILLED{color:var(--success);background:#eaf6ec;border:1px solid #b9dcc0;}
  .status-pill.CANCELLED{color:var(--danger);background:#fbeae6;border:1px solid #e3b8ab;}

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex;gap:2px;margin:18px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .admin-tabs button{background:none;border:none;color:var(--ink-dim);padding:8px 14px;font-family:'Cinzel';text-transform:uppercase;font-size:11.5px;letter-spacing:0.04em;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .admin-tabs button.active{color:var(--gold-deep);border-color:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:'Cinzel';font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-dim);padding:8px 10px;border-bottom:1px solid var(--border-lt);}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .mini-btn{background:var(--cloud2);border:1px solid var(--border-lt);color:var(--ink);padding:4px 9px;font-size:11px;cursor:pointer;border-radius:6px;margin-right:4px;}
  .mini-btn:hover{border-color:var(--gold);}
  .mini-btn.danger:hover{border-color:var(--danger);color:var(--danger);}
  .status-select{background:var(--cloud2);border:1px solid var(--border-lt);color:var(--ink);padding:4px 6px;font-family:'Inter';font-size:11.5px;border-radius:6px;}
  .admin-form{background:var(--cloud);border:1px solid var(--border);border-radius:14px;padding:18px;margin-top:14px;}
  .admin-form .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .empty-state{color:var(--ink-dim);font-size:13px;padding:40px 0;text-align:center;border:1px dashed var(--border-lt);border-radius:12px;}
  .order-code-cell{font-family:'JetBrains Mono';font-size:11px;color:var(--sky-deep);}

  /* ---------- Chat ---------- */
  .chat-wrap{display:flex;flex-direction:column;height:520px;background:var(--cloud);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{max-width:78%;padding:8px 12px;border-radius:10px;background:var(--cloud2);border:1px solid var(--border);font-size:13px;}
  .chat-msg .who{font-family:'Cinzel';font-size:11px;color:var(--gold-deep);margin-bottom:2px;}
  .chat-msg .who .owner-tag, .chat-msg .who .admin-tag{margin-left:6px;}
  .chat-msg .when{font-size:9.5px;color:var(--ink-dim);margin-left:6px;}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
  .chat-input-row input{flex:1;}

  @media(max-width:640px){
    .admin-form .row{grid-template-columns:1fr;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
    .splash-title{font-size:36px;}
  }

  /* ---------- Toasts ---------- */
  .toast-stack{position:fixed;top:16px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--cloud);border:1px solid var(--border);border-left:4px solid var(--gold);
    border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:0 6px 20px rgba(140,109,31,0.18);
    max-width:300px;animation:toastIn 0.3s ease;color:var(--ink);
  }
  .toast.error{border-left-color:var(--danger);}
  .toast.success{border-left-color:var(--success);}
  @keyframes toastIn{ from{ opacity:0; transform:translateX(30px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(30px); } }

  /* ---------- Buttons: press feedback ---------- */
  .btn, .mini-btn{ transition:transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease; }
  .btn:active, .mini-btn:active{ transform:scale(0.96); }

  /* ---------- Confetti / sparkle win effect ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden;}
  .confetti-piece{
    position:absolute;top:-20px;width:8px;height:14px;opacity:0.9;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.2; }
  }
  .win-glow{
    animation:winPulse 1.4s ease-in-out 2;
  }
  @keyframes winPulse{
    0%,100%{ box-shadow:0 0 0 rgba(201,162,74,0); }
    50%{ box-shadow:0 0 40px rgba(201,162,74,0.55); }
  }
  .screen-flash{
    position:fixed;inset:0;z-index:998;pointer-events:none;
    background:radial-gradient(circle at 50% 38%, rgba(255,255,255,0.9), rgba(255,246,217,0.25) 45%, rgba(255,255,255,0) 70%);
    animation:flashPulse 0.7s ease-out forwards;
  }
  @keyframes flashPulse{ from{ opacity:1; } to{ opacity:0; } }
  .wheel-shake{ animation:wheelShake 0.4s ease; }
  @keyframes wheelShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-4px); }
    40%{ transform:translateX(4px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(3px); }
  }
  .wheel-pointer{ animation:pointerGlow 1.4s ease-in-out infinite; }
  @keyframes pointerGlow{
    0%,100%{ filter:drop-shadow(0 0 2px var(--gold)); }
    50%{ filter:drop-shadow(0 0 9px var(--gold)); }
  }

  /* ---------- Brand sparkle ---------- */
  .brand .mark{ position:relative; }
  .brand .mark::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,217,0.6), transparent 70%);
    animation:sparklePulse 2.6s ease-in-out infinite;
  }
  @keyframes sparklePulse{
    0%,100%{ opacity:0.4; transform:scale(0.9); }
    50%{ opacity:0.9; transform:scale(1.15); }
  }

  /* ---------- View fade transition ---------- */
  .view-fade{ animation:viewFadeIn 0.35s ease; }
  @keyframes viewFadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

  /* ---------- Pack badges (Random Godlys) ---------- */
  .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:18px;}
  .pack-card{
    background:var(--cloud);border:1px solid var(--border);border-radius:16px;padding:0;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 2px 14px rgba(140,109,31,0.08);position:relative;
    transition:transform 0.15s;
  }
  .pack-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(140,109,31,0.16);}
  .pack-card.ribbon::before{
    content:attr(data-ribbon);position:absolute;top:12px;right:-30px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:#fff;font-family:'Cinzel';font-size:10px;letter-spacing:0.05em;padding:4px 34px;transform:rotate(40deg);
    box-shadow:0 2px 6px rgba(0,0,0,0.2);z-index:2;
  }
  .pack-badge{

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function genOrderCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';

function genAffiliateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz0123456789';

// ---------- Sound effects (synthesized, no external files needed) ----------
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}
function playTone(freq, duration, type='sine', gainStart=0.08, delay=0){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(gainStart, ctx.currentTime+delay);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime+delay);
  osc.stop(ctx.currentTime+delay+duration+0.02);
}

// Decelerating "ticker" sound while the wheel spins — ticks bunch up early
// (fast spin) and spread out near the end (slowing to a stop).
function scheduleWheelTicks(totalMs){
  const tickCount = 36;
  for(let i=1;i<=tickCount;i++){
    const p = i/tickCount;
    const t = totalMs * Math.pow(p, 2.3);
    setTimeout(()=>SFX.tick(), t);
  }
}

// ---------- Toasts ----------
function ensureToastStack(){
  let stack = document.getElementById('toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toast-stack';
    stack.className = 'toast-stack';
    document.body.appendChild(stack);

  return stack;
}
function toast(message, kind='info'){
  const stack = ensureToastStack();
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='error' ? ' error' : kind==='success' ? ' success' : '');
  el.textContent = message;
  stack.appendChild(el);
  if(kind==='error') SFX.error();
  setTimeout(()=>{

    setTimeout(()=>el.remove(), 300);

}

// ---------- Moderation ----------
const DEFAULT_CURSE_WORDS = ['fuck','shit','bitch','asshole','cunt','nigger','faggot','retard'];
const RESERVED_WORD = 'ascend';

let customBlockedWords = [];

function containsBlockedWord(text){
  const lower = text.toLowerCase();
  for(const w of DEFAULT_CURSE_WORDS){ if(lower.includes(w)) return w; }
  for(const w of customBlockedWords){ if(w && lower.includes(w.toLowerCase())) return w; }
  return null;
}

function containsReservedWord(text, isOwnerSender){
  if(isOwnerSender) return false;
  return text.toLowerCase().includes(RESERVED_WORD);
}

function looksLikeSpam(text, lastMsg){
  const t = text.trim();
  if(t.length === 0) return 'Message is empty.';
  if(t.length > 400) return 'Message is too long.';
  if(/(.)\1{7,}/i.test(t)) return 'Message looks like spam (repeated characters).';
  if(lastMsg && lastMsg.trim().toLowerCase() === t.toLowerCase()) return 'You just sent that message.';
  const linkCount = (t.match(/https?:\/\//g)||[]).length;
  if(linkCount > 2) return 'Too many links in one message.';
  return null;
}

async function registerUser(username, password, referralCodeRaw){
  username = username.trim();
  if(!username || !password) return 'Enter a username and password.';
  if(username.length < 3) return 'Username must be at least 3 characters.';
  if(password.length < 4) return 'Password must be at least 4 characters.';

  const isExactOwnerName = username.toLowerCase() === RESERVED_WORD;
  if(!isExactOwnerName && username.toLowerCase().includes(RESERVED_WORD)){
    return 'That username is reserved.';
  }
  if(containsBlockedWord(username)){
    return 'That username isn\'t allowed. Please choose another.';
  }

  const { data: existing } = await sb.from('app_users').select('id').eq('username', username).maybeSingle();
  if(existing) return 'That username is already on file.';

  // Resolve an optional referral code before creating the account
  let referrer = null;
  const referralCode = (referralCodeRaw||'').trim();
  if(referralCode){
    const { data: refRow } = await sb.from('app_users').select('username, wallet_balance').eq('affiliate_code', referralCode).maybeSingle();
    if(!refRow) return 'That affiliate code was not found.';
    referrer = refRow;
  }

  const { count } = await sb.from('app_users').select('id', { count:'exact', head:true });
  const isFirstEver = (count || 0) === 0;
  const isAdmin = isFirstEver || isExactOwnerName;
  const isOwner = isExactOwnerName;

  // Generate a unique affiliate code (retry on the rare collision)
  let affiliateCode = genAffiliateCode();
  for(let i=0;i<5;i++){
    const { data: clash } = await sb.from('app_users').select('id').eq('affiliate_code', affiliateCode).maybeSingle();
    if(!clash) break;
    affiliateCode = genAffiliateCode();
  }

  const startingWallet = referrer ? REFERRAL_BONUS : 0;
  const passwordHash = await sha256(password + ':' + username.toLowerCase());
  const { error } = await sb.from('app_users').insert({
    username, password_hash: passwordHash, is_admin: isAdmin, is_owner: isOwner,
    affiliate_code: affiliateCode, referred_by: referrer ? referrer.username : null,
    wallet_balance: startingWallet
  });
  if(error) return 'Could not create account: ' + error.message;

  if(referrer){
    await sb.from('app_users').update({ wallet_balance: (referrer.wallet_balance||0) + REFERRAL_BONUS }).eq('username', referrer.username);
  }

  state.user = { username, isAdmin, isOwner, chatBanned:false, spinBalance:0, walletBalance:startingWallet, affiliateCode };
  return null;
}

async function loginUser(username, password){
  username = username.trim();
  if(!username || !password) return 'Enter a username and password.';

  const { data: record, error } = await sb.from('app_users').select('*').eq('username', username).maybeSingle();
  if(error || !record) return 'No account found for that username.';

  const passwordHash = await sha256(password + ':' + username.toLowerCase());
  if(passwordHash !== record.password_hash) return 'Incorrect password.';

  state.user = {
    username: record.username, isAdmin: !!record.is_admin, isOwner: !!record.is_owner,
    chatBanned: !!record.chat_banned, spinBalance: record.spin_balance||0,
    walletBalance: record.wallet_balance||0, affiliateCode: record.affiliate_code||''
  };
  return null;
}

  if(data && data.affiliate_code) state.user.affiliateCode = data.affiliate_code;
}

// Polls the wallet balance and — if it went up since the last check (e.g. an
// admin just approved a top-up or a referral bonus landed) — flashes a
// "+$X" pop animation on the wallet chip without needing a refresh/relogin.
async function pollWalletBalance(){
  if(!state.user) return;
  const prev = state.user.walletBalance || 0;
  const { data, error } = await sb.from('app_users').select('wallet_balance, affiliate_code').eq('username', state.user.username).maybeSingle();
  if(error || !data) return;
  const next = data.wallet_balance || 0;
  state.user.walletBalance = next;
  if(data.affiliate_code) state.user.affiliateCode = data.affiliate_code;
  if(next > prev + 0.001){
    const delta = next - prev;
    state.walletDelta = delta;
    const active = document.activeElement;
    const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    if(!isTyping){
      SFX.success();
      render();
      setTimeout(()=>{ state.walletDelta = null; render(); }, 2200);
    } else {
      // don't yank focus away mid-typing — still clear the flag after a delay
      setTimeout(()=>{ state.walletDelta = null; }, 2200);
    }
  }

async function placeOrder(){
  const items = Object.entries(state.cart)
    .filter(([id,qty])=>qty>0)
    .map(([id,qty])=>{
      const item = state.catalog.find(i=>String(i.id)===String(id));
      return item ? {id:item.id, name:item.name, price:item.price, qty} : null;
    }).filter(Boolean);
  if(items.length===0) return;

  for(const line of items){
    const catItem = state.catalog.find(i=>i.id===line.id);
    if(!catItem || catItem.stock < line.qty){
      toast('Not enough stock for '+line.name+'. Refresh and try again.', 'error');
      return;
    }
  }

  const subtotal = items.reduce((s,i)=>s+i.price*i.qty, 0);
  if(state.appliedPromo && state.appliedPromo.min_spend && subtotal < state.appliedPromo.min_spend){
    toast(`That code needs a minimum spend of $${Number(state.appliedPromo.min_spend).toFixed(2)}.`, 'error');
    state.appliedPromo = null; state.promoInput = ''; render();
    return;
  }
  const discount = computeDiscount(state.appliedPromo, subtotal);
  const total = Math.max(0, subtotal - discount);
  const payment_method = state.payMethod === 'ROBUX' ? 'ROBUX' : 'USD';
  const robux_amount = payment_method === 'ROBUX' ? Math.round(total * (state.robuxRate||100)) : null;
  const order_code = genOrderCode();
  const { data: inserted, error } = await sb.from('orders').insert({
    username: state.user.username, items, total, status:'PENDING', order_code,
    promo_code: state.appliedPromo ? state.appliedPromo.code : null,
    discount_amount: discount, payment_method, robux_amount
  }).select().maybeSingle();
  if(error){ toast('Could not file order: ' + error.message, 'error'); return; }

  for(const line of items){
    const catItem = state.catalog.find(i=>i.id===line.id);
    if(catItem){
      catItem.stock -= line.qty;
      await updateCatalogStock(catItem.id, catItem.stock);
    }
  }

  state.cart = {};
  await clearMyCartItems();
  state.cartOpen = false;
  state.appliedPromo = null;
  state.promoInput = '';
  state.payMethod = 'USD';
  state.lastOrderCode = order_code;
  await loadMyOrders();
  state.view = 'orders';
  render();
}

async function moveWheelItem(id, direction){
  const ranked = state.catalog.filter(i=>i.in_wheel).sort((a,b)=>(a.wheel_order||0)-(b.wheel_order||0));
  const idx = ranked.findIndex(i=>i.id===id);
  const swapIdx = direction==='up' ? idx-1 : idx+1;
  if(idx<0 || swapIdx<0 || swapIdx>=ranked.length) return;
  const a = ranked[idx], b = ranked[swapIdx];
  const aOrder = a.wheel_order, bOrder = b.wheel_order;
  await sb.from('catalog').update({ wheel_order: bOrder }).eq('id', a.id);
  await sb.from('catalog').update({ wheel_order: aOrder }).eq('id', b.id);
  a.wheel_order = bOrder; b.wheel_order = aOrder;

  itemCard(item){
    const qty = state.cart[item.id] || 0;
    const pending = state.pendingQty[item.id] || 1;
    const stockLabel = item.stock === 0 ? 'OUT OF STOCK' : `IN STOCK: ${item.stock}`;
    const stockClass = item.stock === 0 ? 'none' : (item.stock <= 2 ? 'low' : '');
    const viewers = state.viewCounts[item.id] || 0;
    const carts = state.cartCounts[item.id] || 0;
    return `
    <div class="item-card" data-item-hover="${item.id}">
      <div class="item-media">
        ${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)}">` : `<span>${item.emoji || '🔪'}</span>`}
        <div class="stock-tape ${stockClass}">${stockLabel}</div>
      </div>
      <div class="item-body">
        <div class="item-name">${esc(item.name)}</div>
        <div class="item-social">
          ${viewers>0 ? `<span>👁 ${viewers} looking</span>` : ''}
          ${carts>0 ? `<span class="cart-flag">🛒 ${carts} in carts</span>` : ''}
        </div>
        <div class="item-price-row">
          <div class="item-price">$${item.price}</div>
        </div>
        ${qty>0 ? `<div class="info-note" style="margin:0;">In your cart: ${qty}</div>` : ''}
        <div class="qty-row">
          <button data-pending-dec="${item.id}" ${pending<=1?'disabled':''}>−</button>
          <span>${pending}</span>
          <button data-pending-inc="${item.id}" ${pending>=item.stock?'disabled':''}>+</button>
        </div>
        <button class="btn add-btn" data-add="${item.id}" ${item.stock<=0?'disabled':''}>Add to Cart</button>
      </div>
    </div>`;
  },

  renderCartBar(){
    const items = Object.entries(state.cart).filter(([id,qty])=>qty>0);
    if(items.length===0) return '';
    const total = items.reduce((s,[id,qty])=>{
      const item = state.catalog.find(i=>String(i.id)===String(id));
      return s + (item ? item.price*qty : 0);
    }, 0);
    return `
    <div class="cart-bar">
      <div class="info"><b>${items.length}</b> item type(s) · total <b>$${total}</b></div>
      <button class="btn" data-open-cart="1">Review Cart</button>
    </div>`;
  },

  renderCartModal(){
    const items = Object.entries(state.cart).filter(([id,qty])=>qty>0).map(([id,qty])=>{

      return item ? {...item, qty} : null;
    }).filter(Boolean);

    return `
    <div class="modal-overlay" data-close-overlay="1">
      <div class="modal" data-stop="1">
        <h3>Your Cart</h3>

        <div class="cart-total"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
        ${discount>0 ? `<div class="cart-total" style="font-size:13px;color:var(--success);"><span>Discount</span><span>-$${discount.toFixed(2)}</span></div>` : ''}

          <label>Pay With</label>
          <div class="pay-method-row">
            <label class="${state.payMethod==='USD'?'checked':''}">
              <input type="radio" name="pay-method" value="USD" ${state.payMethod==='USD'?'checked':''} data-pay-method="USD"> USD ($${total.toFixed(2)})

    </div>`;

  wheelCard(item){
    const colors = ['#c9a24a','#7fb2d9','#4f8f5f','#b3432f','#9b7fd9','#d97aa0','#3fa9a9','#d99a3f'];
    const seed = String(item.id).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
    const color = colors[seed % colors.length];
    return `
    <div class="wheel-slot" style="flex:0 0 140px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--border);background:linear-gradient(180deg, ${color}26, var(--cloud2) 65%);border-top:3px solid ${color};box-shadow:inset 0 0 20px ${color}30;">
      <div style="font-size:36px;filter:drop-shadow(0 0 7px ${color}90);">${item.image ? `<img src="${esc(item.image)}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;">` : (item.emoji||'🔪')}</div>
      <div style="font-family:'Cinzel';font-size:12px;margin-top:6px;text-align:center;padding:0 6px;">${esc(item.name)}</div>
      <div style="font-family:'JetBrains Mono';color:${color};font-size:12px;font-weight:600;">$${item.price}</div>
    </div>`;
  },

  renderChat(){
    const banned = state.user.chatBanned;
    return `

      </div>
      ${state.chatError ? `<div class="error-note" style="margin:0 12px 12px;">${esc(state.chatError)}</div>` : ''}
      `}

    `;

  chatMessagesHTML(){
    if(state.chatMessages.length===0) return `<div class="empty-state">No messages yet. Say hello!</div>`;
    return state.chatMessages.map(m=>{
      const sender = state.allUsersMap ? state.allUsersMap[m.username] : null;
      let tag = '';
      if(sender && sender.is_owner) tag = `<span class="owner-tag">✦ ASCEND</span>`;
      else if(sender && sender.is_admin) tag = `<span class="admin-tag">ADMIN</span>`;
      return `
      <div class="chat-msg">
        <div class="who">${esc(m.username)}${tag}<span class="when">${new Date(m.created_at).toLocaleTimeString()}</span>
          ${state.user.isAdmin ? `<button class="mini-btn danger" style="margin-left:8px;padding:1px 6px;font-size:9px;" data-delete-chat="${m.id}">delete</button>` : ''}
        </div>
        <div>${esc(m.message)}</div>
      </div>`;
    }).join('');
  },

  scrollChatToBottom(){
    const el = document.getElementById('chat-messages-el');
    if(el) el.scrollTop = el.scrollHeight;
  },

        <button class="btn" data-save-item="1">Save Item</button>
      </div>
    </div>` : ''}

        ${state.inspectingOrders.length===0 ? `<div class="empty-state">No orders from this user yet.</div>` :

          <div class="order-card" style="margin-bottom:10px;">

        <div class="modal-actions">
          <button class="btn secondary" data-close-inspect="1" style="flex:1">Close</button>

      spinBtn.disabled = true;
      spinBtn.textContent = 'Spinning…';

      const pool = state.wheelItems; // already ordered rank 1 (highest) -> lowest
      const sampleSize = Math.min(6, pool.length);
      const shuffledIdx = pool.map((_,i)=>i).sort(()=>Math.random()-0.5).slice(0, sampleSize).sort((a,b)=>a-b);
      const sample = shuffledIdx.map(i=>pool[i]);
      const winner = sample[sample.length-1];
      const cardWidth = 140;
      const reel = $('#wheel-reel');
      const viewport = $('#wheel-viewport');

      const REPEATS = 18;
      let strip = [];
      for(let r=0;r<REPEATS;r++){
        const shuffled = [...sample].sort(()=>Math.random()-0.5);
        strip = strip.concat(shuffled);
      }
      const winnerIndex = strip.length - Math.floor(sample.length/2) - 1;
      strip[winnerIndex] = winner;
      reel.innerHTML = strip.map(item=>App.wheelCard(item)).join('');
      reel.style.transition = 'none';
      reel.style.transform = 'translateX(0px)';
      reel.offsetHeight;

      const viewportWidth = viewport.clientWidth;
      const targetX = -(winnerIndex*cardWidth - viewportWidth/2 + cardWidth/2);

      requestAnimationFrame(()=>{

});
async function loadUserRolesMap(){
  const { data } = await sb.from('app_users').select('username, is_admin, is_owner');
  const map = {};
  (data||[]).forEach(u=>{ map[u.username] = u; });
  state.allUsersMap = map;
}

async function refreshChatOnly(){
  if(!state.user || state.user.chatBanned===undefined) return;
  const prevCount = state.chatMessages.length;
  await Promise.all([loadChatMessages(), loadUserRolesMap()]);
  if(state.chatMessages.length > prevCount) SFX.chat();
  const el = document.getElementById('chat-messages-el');
  if(el){
    const wasNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    el.innerHTML = App.chatMessagesHTML();
    if(wasNearBottom) el.scrollTop = el.scrollHeight;
    // reattach delete buttons since we bypassed full render()
    Array.from(el.querySelectorAll('[data-delete-chat]')).forEach(b=>
      b.addEventListener('click', ()=>deleteChatMessage(Number(b.dataset.deleteChat)))
    );
  }
}

(async function init(){
  applyTheme(getSavedTheme());
  await runStorageDiagnostic();
  if(storageAvailable()){ await Promise.all([loadCatalog(), loadBlockedWords(), loadRobuxRate()]); }
  state.loading = false;
  render();

  setInterval(async ()=>{
    if(!state.user || state.showSplash) return;
    if(state.view==='catalog'){
      await Promise.all([loadCartCounts(), loadPresenceCounts()]);
      const active = document.activeElement;
      const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
      if(!isTyping) render();
    } else if(state.view==='chat'){
      await refreshChatOnly();
    }
  }, 6000);

  // presence heartbeat for whichever item the user last hovered
  setInterval(()=>{
    if(state.user && state.view==='catalog' && state.focusedItemId){
      pingPresence(state.focusedItemId);
    }
  }, 8000);

  // wallet balance — polls independently of view/nav so an admin approval
  // (or a referral bonus) shows up with the pop animation right away,
  // without needing to log out and back in.
  setInterval(()=>{
    if(state.user && !state.showSplash) pollWalletBalance();
  }, 3000);
})();
</script>
